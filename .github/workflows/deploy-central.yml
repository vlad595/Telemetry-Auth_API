
name: Central Telemetry Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - telemetry-auth-api
          - telemetry-api
          - ingestion-api
          - analytics-api
          - hub-pusher
          - telegram-message-service
          - analytics-service

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    concurrency:
      group: telemetry-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy selected service
        shell: bash
        env:
          SELECTED_SERVICE: ${{ inputs.service || 'telemetry-auth-api' }}
        run: |
          set -euo pipefail

          case "$SELECTED_SERVICE" in
            telemetry-auth-api)
              REPO_DIR="/home/vladggaort/Telemetry/Backend/Telemetry-Auth_API"
              ;;
            telemetry-api)
              REPO_DIR="/home/vladggaort/Telemetry/Backend/Telemetry-API"
              ;;
            ingestion-api)
              REPO_DIR="/home/vladggaort/Telemetry/Backend/Ingestion-Telemetry_API"
              ;;
            analytics-api)
              REPO_DIR="/home/vladggaort/Telemetry/Backend/Telemetry-Analytics_API"
              ;;
            hub-pusher)
              REPO_DIR="/home/vladggaort/Telemetry/Other/TelemetryHubPusherService"
              ;;
            telegram-message-service)
              REPO_DIR="/home/vladggaort/Telemetry/Other/Telemetry-MessageSender"
              ;;
            analytics-service)
              REPO_DIR="/home/vladggaort/Telemetry/Other/Telemetry-AnalyticsService"
              ;;
            *)
              echo "Unknown service: $SELECTED_SERVICE"
              exit 1
              ;;
          esac

          echo "Deploying $SELECTED_SERVICE"

          cd "$REPO_DIR"
          git fetch origin main
          git merge --ff-only origin/main

          cd /home/vladggaort/Telemetry/Backend/Telemetry-API

          sudo -n docker compose build "$SELECTED_SERVICE"
          sudo -n docker compose up -d --no-deps "$SELECTED_SERVICE"
          sudo -n docker compose ps "$SELECTED_SERVICE"
