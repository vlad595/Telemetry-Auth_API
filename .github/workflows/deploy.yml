
name: Deploy Auth API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-auth-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy Auth API
        shell: bash
        run: |
          set -euo pipefail

          cd /home/vladggaort/Telemetry/Backend/Telemetry-Auth_API
          git pull --ff-only

          cd /home/vladggaort/Telemetry/Backend/Telemetry-API
          sudo -n docker compose up -d --build --no-deps telemetry-auth-api

          sudo -n docker compose ps telemetry-auth-api
