
name: Deploy Auth API to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-auth-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build project
        run: dotnet build --configuration Release

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          HOST_KEY: ${{ secrets.AZURE_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to Azure
        env:
          AZURE_HOST: ${{ secrets.AZURE_HOST }}
          AZURE_USER: ${{ secrets.AZURE_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes \
              "$AZURE_USER@$AZURE_HOST" << 'EOF'
            set -e

            cd ~/Telemetry/Backend/Telemetry-Auth_API
            git pull --ff-only

            cd ~/Telemetry/Backend/Telemetry-API
            sudo -n docker compose up -d --build --no-deps telemetry-auth-api
            sudo -n docker compose ps telemetry-auth-api
          EOF
